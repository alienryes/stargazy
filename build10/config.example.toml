# Every setting below that has a code default is shown COMMENTED OUT, holding
# that default. Uncommenting one pins it: the value then survives upgrades, and
# a later change to the default no longer reaches this machine. Leave a setting
# commented unless there is a reason to depart from it.
#
# Only [location] has to be filled in, plus [ha] when weather.source says so.

# Where the weather comes from.
#
#   "direct"        - fetch it here, via pyastroweatherio (the same library the
#                     Home Assistant AstroWeather integration wraps). No Home
#                     Assistant needed; this is the default.
#   "homeassistant" - read the AstroWeather sensors from a running HA instance
#                     over its REST API. Needs the [ha] section below.
#
# Both produce identical numbers - `display.py --compare` confirms this
# locally. "direct" needs the extra packages in requirements.txt (~195MB,
# mostly pandas); "homeassistant" needs none of them.
[weather]
source = "direct"

# Condition weighting, passed straight to pyastroweatherio. These are its own
# defaults and match what the HA integration uses; they should be left alone
# without a specific reason. NB the three weakenings are FRACTIONS (the integration's
# settings screen shows the same numbers as percentages).
# cloudcover_weight = 3
# cloudcover_high_weakening = 0.4
# cloudcover_medium_weakening = 0.7
# cloudcover_low_weakening = 1.0
# fog_weight = 3
# seeing_weight = 2
# transparency_weight = 1
# calm_weight = 2
# Approximates lifted index, seeing, transparency and ground fog.
# experimental_features = true
# Open-Meteo model. best_match is the blend, and picks the highest-resolution
# model covering the site; it is the right choice almost everywhere. A single
# model can be named instead where one is known to suit the site better:
# icon_seamless (DWD), ukmo_seamless, metno_seamless, gfs_seamless, ecmwf_ifs025.
# The choice moves the cloud figures substantially, and the coarse global models
# are the ones to be careful with - ecmwf_ifs025 is a 25 km grid and reported 60%
# high cloud over a visibly clear sky at the reference site.
# forecast_model = "best_match"

# Only needed when weather.source = "homeassistant".
[ha]
url = "http://192.168.1.x:8123"
token = "long-lived-access-token-here"

# The observing site. This is the single source of truth for location: setup.sh
# renders UpTonight's own config.yaml from these values, so they are never
# entered twice. Latitude is also what turns a target's declination into the
# altitude it reaches (90 - |lat - dec|).
[location]
latitude = 51.4779
longitude = -0.0015
elevation = 47
timezone = "Europe/London"

# UpTonight runs locally on this Pi from a systemd timer and writes its reports
# here; the display reads them off disk. Nothing else is needed for the targets
# page - no broker, no container, no Home Assistant.
[uptonight]
out_dir = "/home/operations/uptonight/out"

[display]
# "animated" = live data-reactive night sky behind the dashboard (default);
# "static"   = redraw only when the data changes (no animation).
# mode = "animated"
# 12 rather than the 5" build's 20: this panel is 2.5x the pixels, and the render
# loop is O(pixels). Drift and twinkle are unaffected at 12 - only meteors want
# frame rate, so fps is in practice a meteor budget. Measure before raising it.
# fps = 12
# data_refresh_min = 15
# Seconds each page is shown before rotating. The targets page only joins the
# rotation when UpTonight has produced a report, so before the first run the
# display simply stays on the conditions page.
# page_seconds = 20

# Night mode, applied between real dusk and dawn - not on a clock schedule,
# because the point is to stop the panel wrecking dark adaptation and that
# starts when the sky does.
#
#   "off"  - no change (default)
#   "dim"  - same colours, night_dim% brightness
#   "red"  - monochrome red. Long wavelengths leave scotopic vision alone,
#            which is why observers use red torches. Nothing is lost by it:
#            no reading on this display is carried by colour alone.
# night_mode = "off"
# night_dim = 45

# Draw a thin ivory circle around the moon image, marking the full disc rather
# than only the lit part. Off by default - the photograph reads better without
# it - but worth enabling if the card looks too empty near new moon, when
# almost nothing of the Moon is lit and there is very little left to see.
# moon_ring = false

# Meteors in the animated sky are drawn at the rate an observer would actually
# count tonight - shower activity from the solar-longitude table, cut by radiant
# altitude, cloud and moonlight - rather than on a fixed cadence. On a night when
# nothing is falling, nothing falls here either.
#
# That rate is time-compressed, because three an hour is honest and makes an
# animated sky look broken: the panel runs meteors as though watching for this
# many minutes per minute. Raise it for a livelier sky, set it to 1 for real
# time. It scales what is there and cannot manufacture what is not, so a quiet
# night stays quiet at any setting.
# meteor_compression = 20

# The starfield behind the dashboard.
#
# With real_stars = true it is the actual sky: 8,355 catalogue stars to
# magnitude 6.5, plotted where they really are for this site and this minute,
# turning because the Earth does. Recomputed once a minute (about 85 ms) and
# free per frame.
#
# The panel cannot know which way it is facing, so the direction is CHOSEN here
# rather than detected. camera_azimuth is where the window looks (0 = north,
# 180 = south, which is where everything transits from the northern hemisphere);
# camera_altitude is the height of the centre of the view; field_of_view is the
# vertical span in degrees, with the horizontal following from the panel's
# aspect ratio.
#
# Honest note: a real sky is mostly faint stars, so it draws roughly half the
# lit area of the invented starfield it replaces - about 440 stars in view, of
# which 420 are single pixels. It is correct, and it is quieter. Set
# real_stars = false for the old seeded random field if the panel reads better
# that way from where it actually sits.
# limiting_magnitude sets how faint the catalogue is read down to. Raising it
# puts more stars in view at a cost per frame; 6.5 is the naked-eye limit under
# a dark sky and roughly triples the count.
#
# The value is a property of the SITE, not of the panel: it stands for the
# faintest star actually visible from where the display sits. A genuinely dark
# rural sky justifies raising it; a suburban one does not, and setting it above
# what the sky delivers draws stars nobody at the panel could see.
[sky]
# real_stars = true
# camera_azimuth = 180
# camera_altitude = 45
# field_of_view = 90
# limiting_magnitude = 5.0

# Touch controls. Tap the panel once and a control strip appears along the
# bottom for strip_seconds; tap a button to use it, or leave it and it goes
# away again. No controls are drawn until the screen is touched, and nothing
# fires on that first tap - this is a display to look at, not a control panel.
#
# The buttons are: night mode (turns the red filter on or off), pause or resume
# the page rotation, jump to the next page, dimmer, brighter, and blank.
# Blanking turns the backlight off and stops compositing until the next touch,
# which is the only state in which the display is not using a core.
#
# Everything here is transient - the settings above are restored on restart.
# Dimmer and brighter need write access to /sys/class/backlight, which setup.sh
# arranges by putting the account in the "video" group. Touch needs "input",
# from the same place. Requires display.mode = "animated".
[touch]
# enabled = true
# strip_seconds = 6

# Aurora. A fourth page that exists only when there is aurora above this site's
# horizon and it is dark enough to see it - so at temperate latitudes it will be
# absent for years at a time, and that is the design rather than a fault.
#
# The query is not "the probability at my latitude". Aurora emits 100-250 km up
# and is visible far beyond the ground it sits over, so every model cell within
# the horizon is searched, in every direction: the answer comes out north and
# low from southern England, overhead in Iceland, and south in Tasmania without
# any of those being a special case. The forecast is NOAA SWPC's OVATION model,
# which needs no key.
#
# emission_km sets how far into the distance this may claim to see: 250 km is
# the high red emission, the part that clears a distant horizon first and the
# part actually reported from well south of the oval. Lower it to 100 for only
# the green base, which is a much more conservative claim.
#
# threshold_percent is the probability below which nothing is shown. It is not
# per-site on purpose - the same cut gives a temperate site an event every few
# years and a high-latitude one a frequent page, because the difference in
# frequency is real rather than a setting.
[aurora]
# enabled = true
# threshold_percent = 10
# emission_km = 250

# ── Satellite passes ──────────────────────────────────────────────────────
# A page appears when a satellite bright enough to see crosses a dark sky here.
# The objects come from CelesTrak's "visual" group - the ones it lists as
# visible without a telescope - reduced to the named payloads, since three
# quarters of that group is spent rocket stages whose passes say nothing worth
# acting on. That is around forty-five objects.
#
# ⚠ EXPECT THIS PAGE MOST NIGHTS. Measured over a week from 51.4N it was
# present at every sampled instant, against 75% when it tracked only the two
# stations. It is a conditional page in form rather than in practice.
#
# Unlike the aurora page this one does NOT wait for the sky to be dark, because
# a pass is an appointment rather than a condition: the time to show it is
# while there is still a chance of acting on it.
#
# horizon_hours is how far ahead a pass may be and still earn the page. Beyond
# about a day it stops being something to act on and becomes a timetable.
#
# No magnitude is predicted anywhere on the page. Apparent brightness depends on
# which face an object has turned towards the observer and nothing keyless
# reports its attitude, so the page states the geometry it can compute and
# leaves brightness alone. Objects are sorted into two tiers - the recognisable
# and the physically large against everything else - and height orders them
# within a tier; that is a coarse judgement about which objects are worth
# naming, not a prediction of how bright any one pass will be. Ranking on height
# alone was tried and led the page with a 1970s ion-engine testbed at three in
# the morning while an ISS pass the same evening went unmentioned.
[satellites]
# enabled = true
# horizon_hours = 24

# ── The Sun ───────────────────────────────────────────────────────────────
# A page carrying sunspots, flares, any inbound coronal mass ejection, and
# eclipses. It is the only page here that appears while the Sun is UP, and the
# only one always present rather than gated on something happening: the other
# conditional pages describe the night sky and are worthless at noon, whereas
# there is always something true to say about the Sun, and these are the hours
# when the rest of the panel has least to say.
#
# The disc is drawn with today's spot groups at their measured heliographic
# positions, tilted by the season the way the real disc is. Positions are real;
# the marks are enlarged, because a group covering a hundred-millionth of the
# hemisphere is a few pixels across and the disc would otherwise look empty.
#
# An eclipse needs no network at all - it is computed here from the Sun and
# Moon's apparent discs - so it is the one thing this display can still
# announce with the internet down. It is also rare: from southern England
# expect roughly one visible partial a year, and none at all in some years.
#
# eclipse_band_hours is how close an eclipse must be before it takes the top of
# the page. Outside that it is still stated as one line at the foot, however
# far off, because an event announced only on the day is one nobody knew was
# coming. Raise it to see the full layout ahead of time.
#
# Magnitude and obscuration are both given and both named. Magnitude is the
# fraction of the Sun's DIAMETER covered and obscuration the fraction of its
# AREA; they are not the same number and the page never prints one as the other.
[solar]
# enabled = true
# eclipse_band_hours = 24
